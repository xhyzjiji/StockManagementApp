[features]
hooks = true

[mcp_servers.adk-mobile]
command = "adk-mobile-mcp"
args = [
  "--workflow-dir",
  ".ttadk/.adk-mobile"
]

  [mcp_servers.adk-mobile.env]
  platform = "Android"

[mcp_servers.alchemist]
command = "npx"
args = [
  "-y",
  "--registry=https://bnpm.byted.org",
  "@byted/alchemist-mcp@latest",
  "mcp"
]
env = { }
