[model_providers.ttadk_app]
name = "ttadk_app"
base_url = "https://llmbox-global.byteintl.net/"
wire_api = "responses"

  [model_providers.ttadk_app.http_headers]
  X-Source = "ttadk"

  [model_providers.ttadk_app.auth]
  command = "ttadk"
  args = [ "get_params", "--sso", "sso" ]
  timeoutms = 5_000
  refreshintervalms = 2_000_000

[features]
hooks = true

